schema_version: skyseed-static-emulator/v1
# Edit this file to author Mini's SEED network; --scenario selects an alternative.
# Simulator policy and Traffic instrumentation are configured in mini_network.py.
skyseed_autonomous_systems:
  - asn: 65010
    # 1. Constellation: four planes at 90° spacing, eight satellites in each plane.
    shells:
      - shell_id: dynamic-shell
        altitude_km: 550.0
        inclination_deg: 53.0
        # Geometry epoch; the experiment Timeline starts 30 seconds later.
        epoch_utc: "2026-01-01T00:00:00+00:00"
        generation:
          orbit_count: 4
          satellites_per_orbit: 8
          maximum_simultaneous_inter_satellite_links: 4  # Device capacity, not a policy target.
          raan:
            start_deg: 0.0
            step_deg: 90.0
          # 45° in-plane spacing; odd-indexed planes receive a 22.5° offset.
          phase:
            start_deg: 0.0
            step_deg: 45.0
            alternating_orbit_offset_deg: 22.5
    # 2. Three reference gateways; each ix_attachments block joins IX110.
    # Device access capacity is unspecified; Mini's Simulator uses fallback two.
    ground_stations:
      # Canonical reference locations copied from historical v1
      # data/ground/starlink_gateways.json catalog entries selected by
      # s4_visualization_gateway_binding_12.json and V1StaticInputAdapter.
      # These coordinates do not claim any commercial operator's current
      # in-service facilities.
      - ground_station_id: gs-porto-alegre-reference
        display_name: Reference Ground Station - Porto Alegre, Brazil
        latitude_deg: -30.0346
        longitude_deg: -51.2177
        elevation_m: 0.0
        operator: Skyseed
        station_type: gateway
        ix_attachments:
          - ix_id: 110
            address: 10.110.0.101
      - ground_station_id: gs-marsala-reference
        display_name: Reference Ground Station - Marsala, Italy
        latitude_deg: 37.7986
        longitude_deg: 12.4357
        elevation_m: 0.0
        operator: Skyseed
        station_type: gateway
        ix_attachments:
          - ix_id: 110
            address: 10.110.0.102
      - ground_station_id: gs-yamaguchi-reference
        display_name: Reference Ground Station - Yamaguchi, Japan
        latitude_deg: 34.1861
        longitude_deg: 131.4706
        elevation_m: 0.0
        operator: Skyseed
        station_type: gateway
        ix_attachments:
          - ix_id: 110
            address: 10.110.0.103
# 3. Ordinary network: shared IX110 and the service AS/router attached to it.
internet_exchanges:
  - ix_id: 110
    prefix: 10.110.0.0/24
    route_server: false
ordinary_autonomous_systems:
  - asn: 65110
    networks:
      - network_id: service-net
        prefix: 10.210.0.0/24
    routers:
      - router_id: service-router
        network_attachments:
          - network_id: service-net
            address: 10.210.0.254
        ix_attachments:
          - ix_id: 110
            address: 10.110.0.254
# 4. External routing: Porto Alegre peers with the ordinary service router.
ebgp_peerings:
  - ix_id: 110
    first:
      asn: 65010
      router_id: gs-porto-alegre-reference
    second:
      asn: 65110
      router_id: service-router
    relationship: unfiltered
