<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="2795" viewBox="0 0 1740 2795" role="img" aria-labelledby="title description">
<title id="title">SkySEED calculation flow and replaceable Model hooks</title>
<desc id="description">Scene adaptation supplies pure Simulator input. Producer advances time and calls Simulator's physical side and Planner, then the backend Compiler. Position and PhysicalLink produce observations; InterSatellite, GroundStation and ZoneService make different decisions from those observations. Planner handles acquisition; Parameter supplies effective connections; Route consumes connections, service and demands. Planner adopts state and produces Plans. Producer packages and seals materials, and Controller publishes completed requests. Seven blue Model cards are replaceable through existing constructor injection.</desc>
<defs>
 <marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#176a9d"/></marker>
 <marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7952a3"/></marker>
</defs>
<style>
 text {font-family:Arial,Helvetica,sans-serif;fill:#183245}
 .heading {font-size:29px;font-weight:bold}
 .title {font-size:23px;font-weight:bold}
 .body {font-size:19px}
 .caption {font-size:18px;fill:#456274}
 .label {font-size:17px;paint-order:stroke;stroke:#f5f8fb;stroke-width:6px;stroke-linejoin:round}
</style>
<rect width="100%" height="100%" fill="#f5f8fb"/>

<text x="40" y="48" class="caption">SkySEED  /  CALCULATION</text>
<text x="40" y="88" class="heading">Replace the algorithms; keep progression and ownership explicit</text>
<text x="40" y="125" class="caption">Blue cards = replaceable Models. Green nesting = ownership. Arrows = value dependencies; dashed arrows = orchestration.</text>
<g><rect x="40" y="160" width="500" height="200" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="60" y="194" class="title">Scene construction</text>
<path d="M60,209 H520" stroke="#8099aa" opacity=".35"/>
<text x="60" y="239" class="body">Shells, orbital elements and device capabilities</text>
<text x="60" y="267" class="body">GroundStation sites and access capacities</text>
<text x="60" y="295" class="body">SEED Emulator + SkySEED entities</text>
<text x="60" y="323" class="body">No deployment is needed to calculate</text>
</g>
<g><rect x="610" y="160" width="500" height="200" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="630" y="194" class="title">External adapter</text>
<path d="M630,209 H1090" stroke="#8099aa" opacity=".35"/>
<text x="630" y="239" class="body">create_simulator_static_input(systems)</text>
<text x="630" y="267" class="body">Copies receiver-defined static facts</text>
<text x="630" y="295" class="body">Result: SimulatorStaticInput</text>
<text x="630" y="323" class="body">SEED objects stay outside Simulator</text>
</g>
<g><rect x="1180" y="160" width="500" height="200" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="1200" y="194" class="title">Assemble the Simulator</text>
<path d="M1200,209 H1660" stroke="#8099aa" opacity=".35"/>
<text x="1200" y="239" class="body">Definition = static input + finite Timeline</text>
<text x="1200" y="267" class="body">Supply Zone layout and Model instances</text>
<text x="1200" y="295" class="body">Each hook: built-in default OR custom object</text>
<text x="1200" y="323" class="body">create_default_simulator(...)</text>
</g>
<polyline points="540,260 610,260" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1110,260 1180,260" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="40" y="415" width="1640" height="120" rx="10" fill="#f1ecf8" stroke="#8099aa" stroke-width="1.5"/>
<text x="60" y="449" class="title">Producer orchestrates the requested calculation</text>
<path d="M60,464 H1660" stroke="#8099aa" opacity=".35"/>
<text x="60" y="494" class="body">One formal cursor: ask for frame(t), query observations, advance Planner, then call backend compilation at the Compiler cutoff.</text>
<text x="60" y="522" class="body">Prehistory may warm acquisition. A search expansion stays at the same t. Retained continuation advances only the new suffix.</text>
</g>
<rect x="40" y="590" width="1640" height="1695" rx="14" fill="#edf4f0" stroke="#285a49" stroke-width="2"/>
<text x="60" y="625" class="title">Simulator</text>
<text x="60" y="654" class="caption">Owns PhysicalWorld, the PhysicalLink Model and Planner. World identities and physical facts remain available to their consumers.</text>
<polyline points="290,535 290,590" fill="none" stroke="#7952a3" stroke-width="2.2" marker-end="url(#control)" stroke-dasharray="8 5"/>
<text x="305" y="574" class="label">advance t</text>
<polyline points="1500,360 1500,385 1710,385 1710,615 1680,615" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<text x="1540" y="380" class="label">pure inputs</text>
<rect x="65" y="685" width="510" height="265" rx="14" fill="#edf4f0" stroke="#285a49" stroke-width="2"/>
<text x="85" y="720" class="title">PhysicalWorld</text>
<text x="85" y="749" class="caption">Nodes, orbits, sites and optional ZoneLayout</text>
<g><rect x="85" y="765" width="470" height="165" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="105" y="799" class="title">Position · positions at time t</text>
<path d="M105,814 H535" stroke="#176a9d" opacity=".35"/>
<text x="105" y="844" class="body">In: World + requested timestamp</text>
<text x="105" y="872" class="body">Out: complete NodeId → ECEF mapping</text>
<text x="105" y="900" class="body">World returns an immutable position snapshot</text>
</g>
<g><rect x="620" y="700" width="500" height="230" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="640" y="734" class="title">PhysicalLink · potential connections</text>
<path d="M640,749 H1100" stroke="#176a9d" opacity=".35"/>
<text x="640" y="779" class="body">In: World + position snapshot + request</text>
<text x="640" y="807" class="body">Out: ISL, GS and Zone candidate observations</text>
<text x="640" y="835" class="body">Carries available physical measurements</text>
<text x="640" y="863" class="body">Feasible candidates are not selected links</text>
<text x="640" y="891" class="body">Same timestamp as the supplied snapshot</text>
</g>
<g><rect x="1180" y="685" width="460" height="245" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="1200" y="719" class="title">Planner supplies the query scope</text>
<path d="M1200,734 H1620" stroke="#8099aa" opacity=".35"/>
<text x="1200" y="764" class="body">PhysicalLinkRequest: pairs and search scope</text>
<text x="1200" y="792" class="body">Uses InterSatellite potential-pair enumeration</text>
<text x="1200" y="820" class="body">Includes retained / preparing pairs</text>
<text x="1200" y="848" class="body">Optional GS search advice can widen it</text>
<text x="1200" y="876" class="body">Producer repeats a query only as needed</text>
</g>
<polyline points="575,845 620,845" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1180,810 1120,810" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="70" y="985" width="1570" height="100" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="90" y="1019" class="title">PhysicalLinkQueryResult at t</text>
<path d="M90,1034 H1620" stroke="#8099aa" opacity=".35"/>
<text x="90" y="1064" class="body">Separate candidate sets: satellite ↔ satellite  |  ground station ↔ satellite  |  Zone → possible serving satellites</text>
</g>
<polyline points="870,930 870,985" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<rect x="60" y="1120" width="1600" height="1100" rx="14" fill="#edf4f0" stroke="#285a49" stroke-width="2"/>
<text x="80" y="1155" class="title">Planner · algorithm decisions inside framework progression</text>
<text x="80" y="1184" class="caption">The three selection roles consume different candidate sets and prior decision context; one does not call the next.</text>
<g><rect x="80" y="1210" width="480" height="210" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="100" y="1244" class="title">InterSatellite · satellite connections</text>
<path d="M100,1259 H540" stroke="#176a9d" opacity=".35"/>
<text x="100" y="1289" class="body">In: World + ISL candidates + selection state</text>
<text x="100" y="1317" class="body">Out: selected satellite candidate pairs</text>
<text x="100" y="1345" class="body">Also enumerates potential pairs for queries</text>
<text x="100" y="1373" class="body">Selection does not bypass acquisition</text>
</g>
<g><rect x="620" y="1210" width="500" height="210" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="640" y="1244" class="title">GroundStation · ground access</text>
<path d="M640,1259 H1100" stroke="#176a9d" opacity=".35"/>
<text x="640" y="1289" class="body">In: World + GS candidates + selection state</text>
<text x="640" y="1317" class="body">Out: selected ground-access candidates</text>
<text x="640" y="1345" class="body">Framework checks identities and capacities</text>
<text x="640" y="1373" class="body">Preparation can precede operational access</text>
</g>
<g><rect x="1180" y="1210" width="460" height="210" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="1200" y="1244" class="title">ZoneService · serving satellites</text>
<path d="M1200,1259 H1620" stroke="#176a9d" opacity=".35"/>
<text x="1200" y="1289" class="body">In: World + Zone candidates + prior service</text>
<text x="1200" y="1317" class="body">Out: service assignments and changes</text>
<text x="1200" y="1345" class="body">An assignment can be explicitly unserved</text>
<text x="1200" y="1373" class="body">Service choice is not geographic membership</text>
</g>
<polyline points="1640,1030 1670,1030 1670,1195 320,1195 320,1210" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="870,1195 870,1210" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1410,1195 1410,1210" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="80" y="1490" width="480" height="210" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="100" y="1524" class="title">Framework · acquisition handling</text>
<path d="M100,1539 H540" stroke="#8099aa" opacity=".35"/>
<text x="100" y="1569" class="body">Retain original selection start times</text>
<text x="100" y="1597" class="body">Reserve capacity for preparing connections</text>
<text x="100" y="1625" class="body">Advance ISL / GS lifecycle at formal t</text>
<text x="100" y="1653" class="body">Out: candidates operational at this time</text>
</g>
<polyline points="320,1420 320,1490" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="870,1420 870,1450 460,1450 460,1490" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="620" y="1490" width="500" height="230" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="640" y="1524" class="title">Parameter · effective connections</text>
<path d="M640,1539 H1100" stroke="#176a9d" opacity=".35"/>
<text x="640" y="1569" class="body">In: operational candidate observations,</text>
<text x="640" y="1597" class="body">      timestamp + previously adopted memory</text>
<text x="640" y="1625" class="body">Out: connections with effective parameters</text>
<text x="640" y="1653" class="body">      and next opaque parameter memory</text>
<text x="640" y="1681" class="body">Bandwidth, delay and loss follow the Model</text>
</g>
<polyline points="560,1600 620,1600" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="1180" y="1745" width="460" height="230" rx="10" fill="#e5f2fc" stroke="#176a9d" stroke-width="1.5"/>
<text x="1200" y="1779" class="title">Route · paths and unreachable results</text>
<path d="M1200,1794 H1620" stroke="#176a9d" opacity=".35"/>
<text x="1200" y="1824" class="body">In: World + effective connections, service,</text>
<text x="1200" y="1852" class="body">      demands + previous outcomes at t</text>
<text x="1200" y="1880" class="body">Out: a path / next hop OR an explicit</text>
<text x="1200" y="1908" class="body">      unreachable outcome for every demand</text>
<text x="1200" y="1936" class="body">Demands: supplied or optional Model factory</text>
</g>
<polyline points="1120,1600 1150,1600 1150,1860 1180,1860" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1410,1420 1410,1745" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<text x="1425" y="1600" class="label">service assignments</text>
<g><rect x="80" y="1780" width="500" height="195" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="100" y="1814" class="title">Between observations · same owners</text>
<path d="M100,1829 H560" stroke="#8099aa" opacity=".35"/>
<text x="100" y="1859" class="body">Adopted state feeds the next decisions</text>
<text x="100" y="1887" class="body">Acquisition reservations and Model memory</text>
<text x="100" y="1915" class="body">remain private to their live owners</text>
<text x="100" y="1943" class="body">They are not copied into operational state</text>
</g>
<g><rect x="80" y="2040" width="1560" height="155" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="100" y="2074" class="title">Framework · state adoption, Transitions and Plans</text>
<path d="M100,2089 H1620" stroke="#8099aa" opacity=".35"/>
<text x="100" y="2119" class="body">Adopt effective connections, Zone service and route outcomes as current PlannedOperationalState; adopt parameter memory separately.</text>
<text x="100" y="2147" class="body">Derive changes and required semantic event dependencies in PlanTransition; group ordered Transitions into lineage-bearing Plans.</text>
<text x="100" y="2175" class="body">Planner publishes complete Plan prefixes. A request flush preserves the next timestamp and the same live Models.</text>
</g>
<polyline points="870,1720 870,2040" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1410,1975 1410,2040" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<polyline points="1580,1420 1580,1460 1670,1460 1670,2120 1640,2120" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<g><rect x="60" y="2360" width="755" height="200" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="80" y="2394" class="title">Backend Compiler · lowering, not another Model</text>
<path d="M80,2409 H795" stroke="#8099aa" opacity=".35"/>
<text x="80" y="2439" class="body">Producer calls compile_bpf(Plan, World, previous_result)</text>
<text x="80" y="2467" class="body">Consumes the Plan and its event dependencies</text>
<text x="80" y="2495" class="body">Out: BpfCompilationResult with backend execution intents</text>
<text x="80" y="2523" class="body">Does not rerun route selection or own request publication</text>
</g>
<polyline points="440,2195 440,2360" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<text x="455" y="2322" class="label">Plans</text>
<g><rect x="925" y="2360" width="755" height="200" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="945" y="2394" class="title">Producer + Controller · packaging and publication</text>
<path d="M945,2409 H1660" stroke="#8099aa" opacity=".35"/>
<text x="945" y="2439" class="body">Producer appends compilation results, drains accepted work</text>
<text x="945" y="2467" class="body">and seals executable deliveries through material writers</text>
<text x="945" y="2495" class="body">Controller publishes completed request / bounded prefixes</text>
<text x="945" y="2523" class="body">Published results remain readable while computation waits</text>
</g>
<polyline points="815,2460 925,2460" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<text x="835" y="2440" class="label">results</text>
<g><rect x="925" y="2620" width="755" height="120" rx="10" fill="#fff" stroke="#8099aa" stroke-width="1.5"/>
<text x="945" y="2654" class="title">Delivery to separate execution owners</text>
<path d="M945,2669 H1660" stroke="#8099aa" opacity=".35"/>
<text x="945" y="2699" class="body">Sealed Runner materials + completed calculation evidence</text>
<text x="945" y="2727" class="body">Deployment and Runner execution require explicit operations</text>
</g>
<polyline points="1300,2560 1300,2620" fill="none" stroke="#176a9d" stroke-width="2.2" marker-end="url(#data)"/>
<text x="60" y="2636" class="title">Optional capabilities, not universal requirements</text>
<text x="60" y="2672" class="body">ZoneMembership is a lower-level capability inside ZoneLayout.</text>
<text x="60" y="2701" class="body">Prediction, wider search and reuse require explicit support.</text>
<text x="60" y="2730" class="body">Mix Models only when their consumers’ input contracts match.</text>
<text x="40" y="2774" class="caption">Model authors choose algorithms and private representation. Existing owners keep time, validation, adoption, publication and lifecycle.</text>
</svg>
