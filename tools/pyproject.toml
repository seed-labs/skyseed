[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyseed-tools"
version = "0.1.0"
description = "Optional tools for a SkySEED source checkout"
requires-python = ">=3.11"
dependencies = ["skyseed"]

[tool.setuptools]
package-dir = {tools = "."}
packages = [
    "tools", "tools.deployment", "tools.observation",
    "tools.observation.scene", "tools.observation.physical",
    "tools.observation.link", "tools.observation.network",
    "tools.observation.compiler", "tools.observation.execution",
    "tools.observation._presentation",
]

[tool.setuptools.package-data]
tools = ["**/*.html", "**/*.css", "**/*.js", "**/*.json", "**/*.md", "deployment/*.sh"]
